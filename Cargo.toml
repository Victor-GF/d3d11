[package]
name = "d3d11"
version = "0.1.0"
edition = "2024"
# Com dois binarios (o app e src/bin/crt_check.rs), `cargo run` sozinho roda o app.
default-run = "d3d11"

# O arquivo do ponto de entrada não é o padrão (src/main.rs), então declaramos aqui.
[[bin]]
name = "d3d11"
path = "src/winentrypoint.rs"

[dependencies]

# Sem std não existe "unwinding" (desenrolar a pilha no panic): abortamos direto.
# Precisa valer também no perfil dev, senão `cargo build` falha pedindo `eh_personality`.
[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3       
lto = true          
codegen-units = 1   
panic = "abort"
strip = true        
